name: Build and Test (macos)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        host: [
          {
            base: macos-15,
            compiler: { cc: clang, cxx: clang++ },
            vtk: '9.5.0'
          }
        ]
        python: ['3.9', '3.10', '3.11', '3.12']
    runs-on: ${{ matrix.host.base }}
    name: vt-tv build and test (${{ matrix.host.base }}, ${{ matrix.host.compiler.cc }}, vtk-${{ matrix.host.vtk }}, py${{ matrix.python }})
    env:
        VTK_SRC_DIR: /opt/src/vtk
        VTK_BUILD_DIR: /opt/build/vtk
        VTK_DIR: /opt/build/vtk
        VTK_VERSION: ${{ matrix.host.vtk }}
        CACHE_KEY: ${{ matrix.host.base }}-${{ matrix.host.compiler.cc }}-vtk-${{ matrix.host.vtk }}-external-json-py${{ matrix.python }}
        PYTHON_VERSION: ${{ matrix.python }}
        VT_TV_BUILD_DIR: /opt/build
        VT_TV_OUTPUT_DIR: ${{ github.workspace }}/output
        VT_TV_TESTS_OUTPUT_DIR: ${{ github.workspace }}/output/tests
        VT_TV_ARTIFACTS_DIR: /tmp/artifacts
        CONDA_PATH: /opt/conda
        CC: ${{ matrix.host.compiler.cc }}
        CXX: ${{ matrix.host.compiler.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Set folder permissions
        run: |
          sudo chown -R $(whoami) /opt
          mkdir -p ${{ env.VTK_SRC_DIR }} ${{ env.VT_TV_BUILD_DIR }}

      - name: Install dependencies
        run: |
          brew update && brew install coreutils lcov xquartz nlohmann-json

      - name: Load cache (VTK, Miniconda3)
        id: base-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VTK_SRC_DIR }}
            ${{ env.VTK_BUILD_DIR }}
            ${{ env.CONDA_PATH }}
            ~/.zshrc
            ~/.bash_profile
          key: ${{ env.CACHE_KEY }}

      - name: Setup Conda
        if: ${{steps.base-cache.outputs.cache-hit != 'true'}}
        env:
          CONDA_ROOT: ${{ env.CONDA_PATH }}
        run: |
          sudo bash ./ci/setup_conda.sh "${{ matrix.python }}"

      - name: Setup VTK ${{ matrix.host.vtk }}
        if: ${{steps.base-cache.outputs.cache-hit != 'true'}}
        run: |
          bash ./ci/setup_vtk.sh

      - name: Build
        run: |
          bash ./ci/build_cpp.sh ${{ github.workspace }} ${{ env.VT_TV_BUILD_DIR }}

      - name: Test
        run: |
          bash ./ci/test_cpp.sh ${{ github.workspace }} ${{ env.VT_TV_BUILD_DIR }}

      - name: Build Python package (${{ matrix.python }})
        run: |
          bash ./ci/python_build.sh

      - name: Test Python bindings (${{ matrix.python }})
        run: |
          bash ./ci/python_test.sh

      - name: Build macOS package
        run: |
          set -euo pipefail
          BUILD_DIR="${VT_TV_BUILD_DIR}/vt-tv"
          PACKAGE_ROOT="$(mktemp -d)"

          # Reuse the tested build, with runtime paths suitable for installation.
          cmake -S . -B "${BUILD_DIR}" \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=OFF \
            -DVT_TV_MACOS_PACKAGE_ENABLED=ON \
            -DVT_TV_OPENMP_ENABLED=OFF \
            -DVT_TV_TESTS_ENABLED=OFF \
            -DVT_TV_PYTHON_BINDINGS_ENABLED=OFF
          cmake --build "${BUILD_DIR}" --target vttv --parallel
          DESTDIR="${PACKAGE_ROOT}" cmake --install "${BUILD_DIR}" --component macos-runtime

          # The package must not depend on libraries installed on the build runner.
          otool -L "${PACKAGE_ROOT}/usr/local/bin/vttv"
          if otool -L "${PACKAGE_ROOT}/usr/local/bin/vttv" | tail -n +2 | \
              awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)'; then
            echo "::error::vttv has non-system dynamic dependencies"
            exit 1
          fi
          "${PACKAGE_ROOT}/usr/local/bin/vttv" --help

          # Exercise the installed validator and relative paths outside the checkout.
          SMOKE_DIR="$(mktemp -d)"
          cp -R data/lb_test_data "${SMOKE_DIR}/data"
          mkdir "${SMOKE_DIR}/output"
          sed -e 's|directory: data/lb_test_data|directory: data|' \
              -e 's|directory: output/tests/no_png|directory: output|' \
              tests/config/conf-no-png.yaml > "${SMOKE_DIR}/conf.yaml"
          pushd "${SMOKE_DIR}"
          PYTHONDONTWRITEBYTECODE=1 "${CONDA_PATH}/bin/conda" run --no-capture-output -n "py${PYTHON_VERSION}" \
            "${PACKAGE_ROOT}/usr/local/bin/vttv" -c conf.yaml
          test -n "$(find output -name '*.vtp' -print -quit)"
          popd

          VERSION=$(sed -nE 's/^project\(vt-tv VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)
          mkdir -p "${VT_TV_ARTIFACTS_DIR}"
          pkgbuild --root "${PACKAGE_ROOT}/usr/local" \
            --identifier darma.vttv \
            --version "${VERSION}" \
            --install-location /usr/local \
            "${VT_TV_ARTIFACTS_DIR}/vttv-macos-$(uname -m)-${VERSION}-${GITHUB_SHA:0:7}.pkg"

      - name: Collect artifacts
        run: |
          mkdir -p ${{ env.VT_TV_ARTIFACTS_DIR }}

          # > go to output directory
          pushd ${{ env.VT_TV_OUTPUT_DIR }}

          echo "> add junit test report artifact"
          cp "junit-report.xml" ${{ env.VT_TV_ARTIFACTS_DIR }}/ || true

          popd

          echo "> add tests output mesh files and png artifacts"
          if [ -d "${{ env.VT_TV_TESTS_OUTPUT_DIR }}" ]; then
            cp "${{ env.VT_TV_TESTS_OUTPUT_DIR }}/"*".vtp"  ${{ env.VT_TV_ARTIFACTS_DIR }}/  || true
            cp "${{ env.VT_TV_TESTS_OUTPUT_DIR }}/"*".png"  ${{ env.VT_TV_ARTIFACTS_DIR }}/  || true
          fi

          echo "> list of collected artifacts:"
          pushd ${{ env.VT_TV_ARTIFACTS_DIR }}
          find ${{ env.VT_TV_ARTIFACTS_DIR }}  | while read line; do echo "- $line"; done
          popd

      - name: Unit tests
        uses: phoenix-actions/test-reporting@v15
        with:
          name: Tests report
          path: ${{ env.VT_TV_ARTIFACTS_DIR }}/junit-report.xml
          reporter: java-junit
          output-to: step-summary

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vt-tv-artifacts-${{ env.CACHE_KEY }}
          path: ${{ env.VT_TV_ARTIFACTS_DIR }}
