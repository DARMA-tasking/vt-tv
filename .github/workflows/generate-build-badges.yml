name: Generate Build Badges

on:
  workflow_run:
    workflows: ["CI"]
    branches: master
    types:
      - completed

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - id: extract
        run: |
          data=$(gh api --paginate --slurp /repos/DARMA-tasking/vt-tv/actions/runs/${{ github.event.workflow_run.id }}/jobs)

          # Keep one badge per compiler/OS, successful only if every Python job succeeds.
          badges=$(echo "$data" | jq '
            [.[].jobs[] | select(.name | startswith("bake (vt-tv-build-amd64-")) |
              {name: (.name | ltrimstr("bake (vt-tv-build-amd64-") | rtrimstr(")") |
                      sub("-py-[0-9-]+$"; "") | gsub("-cpp"; "")),
               result: .conclusion}] |
            group_by(.name) | map({name: .[0].name,
              result: (if all(.[]; .result == "success") then "success"
                       else "failure" end)})')

          printf "names<<EOF\n%s\nEOF\n" "$(echo "$badges" | jq -r '.[].name')" >>"$GITHUB_OUTPUT"
          printf "results<<EOF\n%s\nEOF\n" "$(echo "$badges" | jq -r '.[].result')" >>"$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: DARMA-tasking/badge-generator@master
        with:
          names:   ${{ steps.extract.outputs.names }}
          results: ${{ steps.extract.outputs.results }}
          github_token: ${{ secrets.BADGE_TOKEN }}
